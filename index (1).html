<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streakline – habit tracker with a GitHub-style heatmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--surface:#fff;--ink:#16213a;--muted:#5d6b85;--line:#d8dfea;--accent:#4f46e5;
--h0:#e1e7f0;--h1:#c7c9f7;--h2:#9a96ee;--h3:#6d64e3;--h4:#3b2fb8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1526;--surface:#182038;--ink:#e8ecf6;--muted:#93a0bd;--line:#2a3452;--accent:#8b86f5;
--h0:#222c48;--h1:#33407a;--h2:#4c55b8;--h3:#7478e6;--h4:#b3b0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 20px 64px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted);margin:10px 0 28px;max-width:52ch}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:24px}
.stat b{font:800 2.2rem "Bricolage Grotesque",sans-serif;display:block;line-height:1}
.stat span{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.cell{width:13px;height:13px;border-radius:3px;background:var(--h0)}
.cell[data-l="1"]{background:var(--h1)}.cell[data-l="2"]{background:var(--h2)}
.cell[data-l="3"]{background:var(--h3)}.cell[data-l="4"]{background:var(--h4)}
.cell.future{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;margin-top:10px;color:var(--muted);font-size:.8rem}
.legend .cell{width:11px;height:11px}
form{display:flex;gap:10px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:500 .95rem "IBM Plex Sans",sans-serif;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{flex:1;font-weight:500}
.name small{display:block;color:var(--muted);font-weight:400}
.check{width:38px;height:38px;border-radius:50%;padding:0;font-size:1.1rem}
.check[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.del{border:0;background:none;color:var(--muted);padding:6px}
.empty{color:var(--muted);padding:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.check{transition:background .15s}}
</style>
</head>
<body>
<main>
  <h1>Streakline</h1>
  <p class="sub">Tick off a habit each day and watch your year fill in, one square at a time. Data stays in your browser.</p>

  <div class="stats">
    <div class="stat"><b id="sToday">0</b><span>done today</span></div>
    <div class="stat"><b id="sStreak">0</b><span>day streak</span></div>
    <div class="stat"><b id="sBest">0</b><span>best streak</span></div>
    <div class="stat"><b id="sTotal">0</b><span>total check-ins</span></div>
  </div>

  <section class="card" aria-label="Activity heatmap">
    <div class="heat-wrap"><div class="heat" id="heat" role="img" aria-label="Check-ins over the past year"></div></div>
    <div class="legend">Less <span class="cell"></span><span class="cell" data-l="1"></span><span class="cell" data-l="2"></span><span class="cell" data-l="3"></span><span class="cell" data-l="4"></span> More</div>
  </section>

  <section class="card" aria-label="Habits">
    <form id="form">
      <input type="text" id="newHabit" placeholder="Add a habit, e.g. Push a commit" maxlength="60" aria-label="New habit name" required>
      <button class="primary" type="submit">Add habit</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty">No habits yet. Add one above to start your first streak.</p>
  </section>

  <div class="row">
    <h2 style="font-size:1.1rem">Backup</h2>
    <div>
      <button id="export">Export JSON</button>
      <button id="reset">Clear all data</button>
    </div>
  </div>
</main>

<script>
const KEY = "streakline.v1";
let state = { habits: [] }; // habit: {id, name, days: ["YYYY-MM-DD", ...]}

try { state = JSON.parse(localStorage.getItem(KEY)) || state; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => iso(new Date());

function streakFor(days) {
  const set = new Set(days);
  let cur = 0, d = new Date();
  if (!set.has(iso(d))) d = addDays(d, -1); // today not done yet doesn't break streak
  while (set.has(iso(d))) { cur++; d = addDays(d, -1); }
  const sorted = [...set].sort();
  let best = 0, run = 0, prev = null;
  for (const s of sorted) {
    const dt = new Date(s + "T00:00:00");
    run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = dt;
  }
  return { cur, best };
}

function toggle(id) {
  const h = state.habits.find(h => h.id === id), t = today();
  h.days = h.days.includes(t) ? h.days.filter(x => x !== t) : [...h.days, t];
  save(); render();
}

function render() {
  const t = today(), n = state.habits.length;
  const counts = {};
  let total = 0, best = 0, streak = 0;
  state.habits.forEach(h => {
    h.days.forEach(d => { counts[d] = (counts[d] || 0) + 1; total++; });
    const s = streakFor(h.days); best = Math.max(best, s.best); streak = Math.max(streak, s.cur);
  });
  document.getElementById("sToday").textContent = `${counts[t] || 0}/${n}`;
  document.getElementById("sStreak").textContent = streak;
  document.getElementById("sBest").textContent = best;
  document.getElementById("sTotal").textContent = total;

  // heatmap: 53 weeks ending this week, columns start on Sunday
  const heat = document.getElementById("heat");
  heat.innerHTML = "";
  const end = new Date(), start = addDays(end, -(52 * 7 + end.getDay()));
  for (let i = 0; i < 53 * 7; i++) {
    const d = addDays(start, i), k = iso(d), c = counts[k] || 0;
    const cell = document.createElement("div");
    const level = n ? Math.min(4, Math.ceil((c / n) * 4)) : 0;
    cell.className = "cell" + (d > end ? " future" : "");
    if (level) cell.dataset.l = level;
    cell.title = `${k}: ${c} of ${n} habits`;
    heat.appendChild(cell);
  }

  const list = document.getElementById("list");
  list.innerHTML = "";
  document.getElementById("empty").hidden = n > 0;
  state.habits.forEach(h => {
    const s = streakFor(h.days), done = h.days.includes(t);
    const li = document.createElement("li");
    li.innerHTML = `<button class="check" aria-pressed="${done}" aria-label="Mark ${h.name.replace(/"/g,"&quot;")} as done today">✓</button>
      <div class="name"></div><button class="del" aria-label="Delete habit">Delete</button>`;
    const name = li.querySelector(".name");
    name.textContent = h.name;
    const sm = document.createElement("small");
    sm.textContent = `${s.cur}-day streak · best ${s.best}`;
    name.appendChild(sm);
    li.querySelector(".check").onclick = () => toggle(h.id);
    li.querySelector(".del").onclick = () => {
      if (confirm(`Delete "${h.name}" and its history?`)) { state.habits = state.habits.filter(x => x.id !== h.id); save(); render(); }
    };
    list.appendChild(li);
  });
}

document.getElementById("form").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("newHabit"), name = input.value.trim();
  if (!name) return;
  state.habits.push({ id: Date.now().toString(36), name, days: [] });
  input.value = ""; save(); render();
};
document.getElementById("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  a.download = "streakline-backup.json"; a.click();
};
document.getElementById("reset").onclick = () => {
  if (confirm("Delete all habits and history? This can't be undone.")) { state = { habits: [] }; save(); render(); }
};
render();
</script>
</body>
</html>
